version: "3.9"

services:
  postgres:
    image: postgis/postgis:17-3.5
    container_name: oki-db
    environment:
      POSTGRES_DB: oki
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/migrations/001_core_schema.sql:/docker-entrypoint-initdb.d/01_schema.sql
      - ./backend/rls-policies/001_core_rls.sql:/docker-entrypoint-initdb.d/02_rls.sql
      - ./backend/migrations/002_seed_data.sql:/docker-entrypoint-initdb.d/03_seed.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
