project_id = "oki-app"

[api]
port = 54321
schemas = ["public", "storage"]

[db.migrations]
enabled = true
schema_paths = []

[db.seed]
enabled = true
sql_paths = ["./seed.sql"]

# ─── Auth (local dev only — real credentials go in the Supabase Dashboard) ───
# Uncomment and fill in to test SMS/Email OTP and Google OAuth with `supabase start`.
# See .env.example for where to find each value.

# [auth]
# site_url = "http://127.0.0.1:54321"
# additional_redirect_urls = ["oki://login"]
# enable_confirmations = true

# [auth.email]
# enable_signup = true
# enable_confirmations = true
# [auth.email.smtp]
# host = "smtp.resend.com"
# port = 465
# user = "resend"
# pass = "re_xxxxxxxx"
# sender_name = "Oki"
# sender_email = "onboarding@resend.dev"

# [auth.sms]
# enable_signup = true
# enable_confirmations = false
# [auth.sms.twilio]
# enabled = true
# account_sid = "ACxxxxxxxx"
# message_service_sid = "MGxxxxxxxx"
# auth_token = "your_auth_token"

# [auth.external.google]
# enabled = true
# client_id = "xxxx.apps.googleusercontent.com"
# secret = "GOCSPX-xxxx"
# redirect_uri = "http://127.0.0.1:54321/auth/v1/callback"

[functions]
[functions.kyc-upload]
verify_jwt = false
import_map = "./import_map.json"

[functions.submit-onboarding]
verify_jwt = false
import_map = "./import_map.json"

[functions.kyc-admin-list]
verify_jwt = true
import_map = "./import_map.json"

[functions.kyc-admin-review]
verify_jwt = true
import_map = "./import_map.json"

[functions.kyc-admin-bulk-review]
verify_jwt = true
import_map = "./import_map.json"

[functions.accept-booking]
verify_jwt = true
import_map = "./import_map.json"

[functions.reject-booking]
verify_jwt = true
import_map = "./import_map.json"

[functions.complete-booking]
verify_jwt = true
import_map = "./import_map.json"

[functions.payment-webhook]
verify_jwt = false
import_map = "./import_map.json"

[functions.seed]
verify_jwt = false
import_map = "./import_map.json"

[functions.create-booking]
verify_jwt = true
import_map = "./import_map.json"

# verify_jwt stays false because the function itself requires the service-role
# bearer (constant-time compare); the cron job in migration 012 supplies it.
[functions.notification-worker]
verify_jwt = false
import_map = "./import_map.json"

[functions.flag-review]
verify_jwt = true
import_map = "./import_map.json"

[functions.reviews-admin-queue]
verify_jwt = true
import_map = "./import_map.json"

[functions.review-flag-action]
verify_jwt = true
import_map = "./import_map.json"